<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureText - 文本加密解密工具</title>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"
      integrity="sha512-a+SUDuwNzXDvz4XrIcXHuCf089/iJAoN4lmrXJg18XnduKK6YlDHNRalv4yd1N40OKI80tFidF+rqTFKGPoWFQ=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <link
      href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./secure-text.css" />
  </head>
  <body class="font-serif bg-gray-50 min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <header
      class="bg-white shadow-md sticky top-0 z-50 transition-all duration-300"
    >
      <div
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="flex items-center space-x-2">
          <i class="fa fa-lock text-primary text-2xl"></i>
          <h1 class="text-xl md:text-2xl font-bold text-dark">SecureText</h1>
        </div>
      </div>
    </header>

    <!-- 主要内容区 -->
    <main class="font-sans flex-grow container mx-auto px-4 py-8">
      <!-- 解密区域 -->
      <section
        id="decrypt"
        class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 transform transition-all duration-500 hover:shadow-2xl mb-8"
      >
        <div class="space-y-8">
          <div class="flex items-center mb-4">
            <div
              class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mr-3"
            >
              <i class="fa fa-unlock-alt text-primary"></i>
            </div>
            <h3 class="text-xl font-semibold text-dark">解密文本</h3>
          </div>

          <div
            id="decrypt-instructions"
            class="bg-blue-50 border border-blue-200 rounded-lg p-4"
          >
            <div class="flex items-start">
              <div class="flex-shrink-0 mt-0.5">
                <i class="fa fa-info-circle text-blue-500 text-lg"></i>
              </div>
              <div class="ml-3">
                <h4 class="text-sm font-medium text-blue-800">
                  已从链接中提取加密参数
                </h4>
                <p class="mt-1 text-sm text-blue-700">请输入密码进行解密</p>
              </div>
            </div>
          </div>

          <div class="space-y-4">
            <div>
              <label
                for="password-decrypt"
                class="block text-sm font-medium text-gray-700 mb-1"
                >输入密码</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password-decrypt"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200"
                  placeholder="输入密码..."
                />
                <button
                  type="button"
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  id="toggle-password-decrypt"
                >
                  <i class="fa fa-eye-slash"></i>
                </button>
              </div>
            </div>

            <button
              id="decrypt-button"
              class="bg-secondary hover:bg-secondary/90 text-white font-medium py-3 px-4 rounded-lg shadow transition-all duration-200 flex items-center justify-center"
            >
              <i class="fa fa-unlock-alt mr-2"></i> 解密文本
            </button>

            <div id="decrypted-result-container" class="hidden mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >解密结果</label
              >
              <div
                id="decrypted-result"
                class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 resize-none h-20"
              ></div>
            </div>
          </div>
        </div>
      </section>

      <!-- 加密区域 -->
      <section
        id="encrypt"
        class="bg-white rounded-2xl shadow-xl p-6 md:p-10 transform transition-all duration-500 hover:shadow-2xl"
      >
        <div class="space-y-8">
          <div class="flex items-center mb-4">
            <div
              class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mr-3"
            >
              <i class="fa fa-lock text-primary"></i>
            </div>
            <h3 class="text-xl font-semibold text-dark">加密文本</h3>
          </div>

          <div class="space-y-4">
            <div>
              <label
                for="text-input"
                class="block text-sm font-medium text-gray-700 mb-1"
                >输入文本</label
              >
              <textarea
                id="text-input"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 resize-none h-32"
                placeholder="输入要加密的文本..."
              ></textarea>
            </div>

            <div>
              <label
                for="password-encrypt"
                class="block text-sm font-medium text-gray-700 mb-1"
                >输入密码</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password-encrypt"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200"
                  placeholder="输入密码..."
                />
                <button
                  type="button"
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  id="toggle-password-encrypt"
                >
                  <i class="fa fa-eye-slash"></i>
                </button>
              </div>
            </div>

            <button
              id="encrypt-button"
              class="bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg shadow transition-all duration-200 flex items-center justify-center"
            >
              <i class="fa fa-lock mr-2"></i> 加密并生成链接
            </button>

            <div id="share-links-container" class="hidden mt-4 space-y-4">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >加密结果分享链接</label
              >

              <div
                id="web-url"
                class="truncate select-all w-full p-3 border border-gray-300 rounded-lg bg-gray-50 transition-all duration-200"
              ></div>
            </div>
          </div>
        </div>
      </section>
    </main>

    <!-- 通知组件 -->
    <div
      id="notification"
      class="fixed bottom-4 right-4 bg-white rounded-lg shadow-lg p-4 transform translate-y-20 opacity-0 transition-all duration-300 z-50 max-w-sm"
    >
      <div class="flex items-start">
        <div id="notification-icon-container" class="flex-shrink-0 mt-0.5">
          <i
            id="notification-icon"
            class="fa fa-check-circle text-green-500 text-xl"
          ></i>
        </div>
        <div class="ml-3">
          <h3 id="notification-title" class="text-sm font-medium text-gray-800">
            操作成功
          </h3>
          <div id="notification-message" class="mt-1 text-sm text-gray-600">
            文本已复制到剪贴板
          </div>
        </div>
        <button
          id="close-notification"
          class="ml-auto flex-shrink-0 flex items-center justify-center h-5 w-5 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 focus:outline-none"
        >
          <i class="fa fa-times text-xs"></i>
        </button>
      </div>
    </div>

    <script>
      // 导航栏滚动效果
      window.addEventListener("scroll", function () {
        const header = document.querySelector("header");
        if (window.scrollY > 50) {
          header.classList.add("py-2");
          header.classList.add("shadow-lg");
        } else {
          header.classList.remove("py-2");
          header.classList.remove("shadow-lg");
        }
      });

      // 密码显示/隐藏切换（加密）
      document
        .getElementById("toggle-password-encrypt")
        .addEventListener("click", function () {
          const input = document.getElementById("password-encrypt");
          const type =
            input.getAttribute("type") === "password" ? "text" : "password";
          input.setAttribute("type", type);

          // 切换图标
          if (type === "text") {
            this.innerHTML = '<i class="fa fa-eye"></i>';
          } else {
            this.innerHTML = '<i class="fa fa-eye-slash"></i>';
          }
        });

      // 密码显示/隐藏切换（解密）
      document
        .getElementById("toggle-password-decrypt")
        .addEventListener("click", function () {
          const input = document.getElementById("password-decrypt");
          const type =
            input.getAttribute("type") === "password" ? "text" : "password";
          input.setAttribute("type", type);

          // 切换图标
          if (type === "text") {
            this.innerHTML = '<i class="fa fa-eye"></i>';
          } else {
            this.innerHTML = '<i class="fa fa-eye-slash"></i>';
          }
        });

      /**
       * 使用PBKDF2密钥派生和AES加密文本
       * @param {string} plainText - 明文文本
       * @param {string} password - 密码
       * @returns {Object} - 包含加密参数的对象
       */
      function encryptText(plainText, password) {
        // 生成随机盐值 (16字节)
        const salt = CryptoJS.lib.WordArray.random(16);
        // 迭代次数
        const iterations = 300000;
        // 密钥长度 (256位)
        const keySize = 256 / 32;

        // 使用PBKDF2进行密钥派生
        const key = CryptoJS.PBKDF2(password, salt, {
          keySize: keySize,
          iterations: iterations,
          hasher: CryptoJS.algo.SHA256,
        });

        // 生成随机IV (16字节)
        const iv = CryptoJS.lib.WordArray.random(16);

        // 使用派生的密钥进行AES加密
        const encrypted = CryptoJS.AES.encrypt(plainText, key, {
          mode: CryptoJS.mode.CBC,
          padding: CryptoJS.pad.Pkcs7,
          iv: iv,
        });

        // 将IV和密文的Base64合并（IV固定24个Base64字符）
        const ivBase64 = iv.toString(CryptoJS.enc.Base64); // 16字节 → 24字符
        const ciphertextBase64 = encrypted.ciphertext.toString(
          CryptoJS.enc.Base64
        );
        const combined = ivBase64 + ciphertextBase64; // 合并IV和密文

        return {
          combined: combined,
          salt: salt.toString(CryptoJS.enc.Base64),
          iterations: iterations,
        };
      }

      /**
       * 使用PBKDF2密钥派生和解密AES加密的文本
       * @param {Object} params - 包含加密参数的对象
       * @param {string} password - 密码
       * @returns {string} - 解密后的明文文本
       */
      function decryptText(params, password) {
        // 拆分IV和密文（IV的Base64固定24字符）
        const ivBase64 = params.combined.substring(0, 24);
        const ciphertextBase64 = params.combined.substring(24);

        // 解析各参数
        const ciphertext = CryptoJS.enc.Base64.parse(ciphertextBase64);
        const iv = CryptoJS.enc.Base64.parse(ivBase64);
        const salt = CryptoJS.enc.Base64.parse(params.salt);
        const iterations = parseInt(params.iterations, 10);
        const keySize = 256 / 32;

        // 派生密钥
        const key = CryptoJS.PBKDF2(password, salt, {
          keySize: keySize,
          iterations: iterations,
          hasher: CryptoJS.algo.SHA256,
        });

        // 解密
        const decrypted = CryptoJS.AES.decrypt(
          { ciphertext: ciphertext },
          key,
          {
            mode: CryptoJS.mode.CBC,
            padding: CryptoJS.pad.Pkcs7,
            iv: iv,
          }
        );

        return decrypted.toString(CryptoJS.enc.Utf8);
      }

      // 加密按钮点击处理
      document
        .getElementById("encrypt-button")
        .addEventListener("click", function () {
          const text = document.getElementById("text-input").value.trim();
          const password = document
            .getElementById("password-encrypt")
            .value.trim();

          if (!text) {
            showNotification("错误", "请输入要加密的文本", "error");
            return;
          }

          if (!password) {
            showNotification("错误", "请输入加密密码", "error");
            return;
          }

          try {
            // 调用加密函数
            const encryptedData = encryptText(text, password);

            document
              .getElementById("decrypted-result-container")
              .classList.add("hidden");

            // 生成网页链接（仅需3个参数）
            const hashParams = new URLSearchParams();
            hashParams.set("c", encryptedData.combined);
            hashParams.set("s", encryptedData.salt);
            hashParams.set("it", encryptedData.iterations);
            const webUrl = new URL(location.pathname, location.href);
            // 存在 hash 中，确保数据不会发往服务端
            webUrl.hash = "#" + hashParams.toString();

            document.getElementById("web-url").textContent = webUrl.toString();
            history.replaceState(undefined, undefined, webUrl);
            render();

            // 显示链接容器
            document
              .getElementById("share-links-container")
              .classList.remove("hidden");

            showNotification("成功", "文本已加密并生成分享链接", "success");
          } catch (error) {
            console.error("Encryption error:", error);
            showNotification("加密失败", "发生了一个错误，请重试", "error");
          }
        });

      // 解密按钮点击处理
      document
        .getElementById("decrypt-button")
        .addEventListener("click", function () {
          // 从URL参数获取加密数据
          const params = new URLSearchParams(window.location.hash.substring(1));

          // 验证参数完整性
          const encryptedData = {
            combined: params.get("c"),
            salt: params.get("s"),
            iterations: params.get("it"),
          };

          const password = document
            .getElementById("password-decrypt")
            .value.trim();

          // 验证必要参数
          if (!encryptedData.combined) {
            showNotification("错误", "请通过链接提供密文", "error");
            return;
          }

          // 验证IV+密文格式是否正确（至少需要包含完整IV）
          if (encryptedData.combined.length < 24) {
            showNotification("错误", "密文格式不正确", "error");
            return;
          }

          if (!encryptedData.salt || !encryptedData.iterations) {
            showNotification(
              "错误",
              "加密参数不完整，请使用正确的分享链接",
              "error"
            );
            return;
          }

          if (!password) {
            showNotification("错误", "请输入解密密码", "error");
            return;
          }

          try {
            // 调用解密函数
            const decryptedText = decryptText(encryptedData, password);

            // 显示解密结果
            document.getElementById("decrypted-result").textContent =
              decryptedText;
            document
              .getElementById("decrypted-result-container")
              .classList.remove("hidden");
            document
              .getElementById("share-links-container")
              .classList.add("hidden");

            showNotification("成功", "文本已成功解密", "success");
          } catch (error) {
            console.error("Decryption error:", error);
            showNotification("解密失败", "密码可能不正确或参数不完整", "error");
          }
        });

      // 显示通知
      function showNotification(title, message, type = "success") {
        const notification = document.getElementById("notification");
        const notificationTitle = document.getElementById("notification-title");
        const notificationMessage = document.getElementById(
          "notification-message"
        );
        const notificationIcon = document.getElementById("notification-icon");
        const notificationIconContainer = document.getElementById(
          "notification-icon-container"
        );

        // 设置通知内容
        notificationTitle.textContent = title;
        notificationMessage.textContent = message;

        // 设置通知图标和颜色
        if (type === "success") {
          notificationIcon.className =
            "fa fa-check-circle text-green-500 text-xl";
          notificationIconContainer.className = "flex-shrink-0 mt-0.5";
        } else if (type === "error") {
          notificationIcon.className =
            "fa fa-exclamation-circle text-red-500 text-xl";
          notificationIconContainer.className = "flex-shrink-0 mt-0.5";
        } else if (type === "warning") {
          notificationIcon.className =
            "fa fa-exclamation-triangle text-yellow-500 text-xl";
          notificationIconContainer.className = "flex-shrink-0 mt-0.5";
        } else if (type === "info") {
          notificationIcon.className =
            "fa fa-info-circle text-blue-500 text-xl";
          notificationIconContainer.className = "flex-shrink-0 mt-0.5";
        }

        // 显示通知
        notification.classList.remove("translate-y-20", "opacity-0");

        // 自动关闭
        setTimeout(() => {
          closeNotification();
        }, 5000);
      }

      // 关闭通知
      document
        .getElementById("close-notification")
        .addEventListener("click", closeNotification);

      function closeNotification() {
        const notification = document.getElementById("notification");
        notification.classList.add("translate-y-20", "opacity-0");
      }

      function render() {
        let hasEncryptedParams = false;
        if (location.hash.startsWith("#")) {
          const params = new URLSearchParams(window.location.hash.substring(1));
          hasEncryptedParams =
            params.get("c") && params.get("s") && params.get("it");
        }
        // 显示或隐藏解密区域
        if (hasEncryptedParams) {
          document.getElementById("decrypt").classList.remove("hidden");
          document.getElementById("password-decrypt").focus();
        } else {
          document.getElementById("decrypt").classList.add("hidden");
        }
      }
      window.addEventListener("hashchange", () => {
        render();
      });
      render();
    </script>
  </body>
</html>
