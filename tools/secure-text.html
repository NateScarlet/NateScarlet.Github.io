<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SecureText - 文本加密解密工具</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
      integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./secure-text.css" />
  </head>
  <body class="font-serif bg-gray-50 min-h-screen flex flex-col">
    <!-- 导航栏 -->
    <header
      class="bg-white shadow-md sticky top-0 z-50 transition-all duration-300"
    >
      <div
        class="container mx-auto px-4 py-4 flex justify-between items-center"
      >
        <div class="flex items-center space-x-2">
          <i class="fa fa-lock text-primary text-2xl"></i>
          <h1 class="text-xl md:text-2xl font-bold text-dark">SecureText</h1>
        </div>
      </div>
    </header>

    <!-- 主要内容区 -->
    <main class="font-sans flex-grow container mx-auto px-4 py-8">
      <!-- 解密区域 -->
      <form
        id="decrypt"
        class="hidden bg-white rounded-2xl shadow-xl p-6 md:p-10 transform transition-all duration-500 hover:shadow-2xl mb-8"
        action="javascript:void(0)"
      >
        <div class="space-y-8">
          <div class="flex items-center mb-4">
            <div
              class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mr-3"
            >
              <i class="fa fa-unlock-alt text-primary"></i>
            </div>
            <h3 class="text-xl font-semibold text-dark">解密文本</h3>
          </div>

          <div
            id="decrypt-instructions"
            class="bg-blue-50 border border-blue-200 rounded-lg p-4"
          >
            <div class="flex items-start">
              <div class="flex-shrink-0 mt-0.5">
                <i class="fa fa-info-circle text-blue-500 text-lg"></i>
              </div>
              <div class="ml-3">
                <h4 class="text-sm font-medium text-blue-800">
                  已从链接中提取加密参数
                </h4>
                <p class="mt-1 text-sm text-blue-700">请输入密码进行解密</p>
              </div>
            </div>
          </div>

          <div class="space-y-4">
            <div>
              <label
                for="password-decrypt"
                class="block text-sm font-medium text-gray-700 mb-1"
                >输入密码</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password-decrypt"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200"
                  placeholder="输入密码..."
                />
                <button
                  type="button"
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  id="toggle-password-decrypt"
                >
                  <i class="fa fa-eye-slash"></i>
                </button>
              </div>
            </div>

            <button
              id="decrypt-button"
              type="submit"
              class="bg-secondary hover:bg-secondary/90 text-white font-medium py-3 px-4 rounded-lg shadow transition-all duration-200 flex items-center justify-center"
            >
              <i class="fa fa-unlock-alt mr-2"></i> 解密文本
            </button>

            <div id="decrypted-result-container" class="hidden mt-4">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >解密结果</label
              >
              <div
                id="decrypted-result"
                class="w-full p-3 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 min-h-20 whitespace-pre-wrap"
              ></div>
            </div>
          </div>
          <!-- 解密区域通知容器 -->
          <div
            id="decrypt-notification"
            class="hidden p-4 rounded-md mb-4"
          ></div>
        </div>
      </form>

      <!-- 加密区域 -->
      <form
        id="encrypt"
        action="javascript:void(0)"
        class="bg-white rounded-2xl shadow-xl p-6 md:p-10 transform transition-all duration-500 hover:shadow-2xl"
      >
        <div class="space-y-8">
          <div class="flex items-center mb-4">
            <div
              class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center mr-3"
            >
              <i class="fa fa-lock text-primary"></i>
            </div>
            <h3 class="text-xl font-semibold text-dark">加密文本</h3>
          </div>

          <div class="space-y-4">
            <div>
              <label
                for="text-input"
                class="block text-sm font-medium text-gray-700 mb-1"
                >输入文本</label
              >
              <textarea
                id="text-input"
                class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200 resize-none h-32"
                placeholder="输入要加密的文本..."
              ></textarea>
            </div>

            <div>
              <label
                for="password-encrypt"
                class="block text-sm font-medium text-gray-700 mb-1"
                >输入密码</label
              >
              <div class="relative">
                <input
                  type="password"
                  id="password-encrypt"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200"
                  placeholder="输入密码..."
                />
                <button
                  type="button"
                  class="absolute right-3 top-1/2 transform -translate-y-1/2 text-gray-400 hover:text-gray-600"
                  id="toggle-password-encrypt"
                >
                  <i class="fa fa-eye-slash"></i>
                </button>
              </div>
            </div>

            <button
              id="encrypt-button"
              type="submit"
              class="bg-primary hover:bg-primary/90 text-white font-medium py-3 px-4 rounded-lg shadow transition-all duration-200 flex items-center justify-center"
            >
              <i class="fa fa-lock mr-2"></i> 加密并生成链接
            </button>

            <div id="share-links-container" class="hidden mt-4 space-y-4">
              <label class="block text-sm font-medium text-gray-700 mb-1"
                >加密结果分享链接</label
              >

              <div
                id="web-url"
                class="truncate select-all w-full p-3 border border-gray-300 rounded-lg bg-gray-50 transition-all duration-200"
              ></div>
            </div>
          </div>
          <!-- 加密区域通知容器 -->
          <div
            id="encrypt-notification"
            class="hidden p-4 rounded-md mb-4"
          ></div>
        </div>
      </form>
    </main>

    <!-- 加载提示元素 -->
    <div
      id="loading-modal"
      class="fixed inset-0 z-50 flex items-center justify-center bg-gray-900/50 font-sans"
    >
      <div class="bg-white p-8 rounded-lg shadow-lg">
        <div class="flex items-center justify-center">
          <div
            class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-primary mr-4"
          ></div>
          <p class="text-lg font-bold text-center">正在处理，请稍候...</p>
        </div>
      </div>
    </div>

    <script>
      // 导航栏滚动效果
      window.addEventListener("scroll", function () {
        const header = document.querySelector("header");
        if (window.scrollY > 50) {
          header.classList.add("py-2");
          header.classList.add("shadow-lg");
        } else {
          header.classList.remove("py-2");
          header.classList.remove("shadow-lg");
        }
      });

      let passwordVisible = false;
      let loadingCount = 0;
      function render() {
        try {
          for (const passwordInput of [
            document.getElementById("password-encrypt"),
            document.getElementById("password-decrypt"),
          ]) {
            if (passwordInput instanceof HTMLInputElement) {
              passwordInput.type = passwordVisible ? "text" : "password";
              const button =
                passwordInput.parentElement.querySelector("button");
              if (button) {
                if (passwordVisible) {
                  button.innerHTML = '<i class="fa fa-eye"></i>';
                } else {
                  button.innerHTML = '<i class="fa fa-eye-slash"></i>';
                }
              }
            }
          }

          // 显示或隐藏解密区域
          if (location.hash.startsWith("#AES.")) {
            const el = document.getElementById("decrypt");
            if (el.classList.contains("hidden")) {
              el.classList.remove("hidden");
              document.getElementById("password-decrypt").focus();
            }
          } else {
            document.getElementById("decrypt").classList.add("hidden");
          }

          const loadingModal = document.getElementById("loading-modal");
          if (loadingCount > 0) {
            loadingModal.classList.remove("hidden");
          } else {
            loadingModal.classList.add("hidden");
          }
        } catch (err) {
          console.error("Render Error:", err);
        }
      }

      // 密码显示/隐藏切换（加密）
      document
        .getElementById("toggle-password-encrypt")
        .addEventListener("click", function () {
          passwordVisible = !passwordVisible;
          render();
        });

      // 密码显示/隐藏切换（解密）
      document
        .getElementById("toggle-password-decrypt")
        .addEventListener("click", function () {
          passwordVisible = !passwordVisible;
          render();
        });

      /**
       * @param {string} base64 - 标准 base64 编码的数据
       * @returns {string} - base64 url 编码的数据
       */
      function toBase64URL(base64) {
        return base64.replace(/\+/g, "-").replace(/\//g, "_").replace(/=/g, "");
      }

      /**
       * 将 Base64 URL 编码的字符串转换为标准 Base64 编码
       * @param {string} base64url - Base64 URL 编码的字符串
       * @returns {string} - 标准 Base64 编码的字符串
       */
      function fromBase64URL(base64url) {
        // 替换 URL 安全字符回标准字符
        let base64 = base64url.replace(/-/g, "+").replace(/_/g, "/");

        // 计算所需填充长度（使总长度为4的倍数）
        const padLength = (4 - (base64.length % 4)) % 4;

        // 添加必要的填充等号
        return base64 + "=".repeat(padLength);
      }

      /**
       * 使用PBKDF2密钥派生和AES加密文本（Web Crypto API版）
       * @param {string} plainText - 明文文本
       * @param {string} password - 密码
       * @returns {Promise<Object>} - 包含加密参数的对象
       */
      async function encryptText(plainText, password) {
        // 生成iv (16字节)
        const iv = crypto.getRandomValues(new Uint8Array(16));
        // 因为每次都是从头生成密钥，所以直接用 iv 作为 salt，可以缩短网址
        const salt = iv;
        const iterations = 300000;

        // 准备密钥派生参数
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        // 派生AES密钥
        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt: salt,
            iterations: iterations,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-CBC", length: 256 },
          true,
          ["encrypt"]
        );

        // 加密文本
        const encryptedData = await crypto.subtle.encrypt(
          { name: "AES-CBC", iv },
          key,
          new TextEncoder().encode(plainText)
        );

        // 合并IV和密文
        const combined = new Uint8Array(iv.length + encryptedData.byteLength);
        combined.set(iv, 0);
        combined.set(new Uint8Array(encryptedData), iv.length);

        // 转换为Base64
        return {
          combined: arrayBufferToBase64(combined),
          salt: arrayBufferToBase64(salt),
          iterations: iterations,
        };
      }

      /**
       * 使用PBKDF2密钥派生和解密AES加密的文本
       * @param {Object} params - 包含加密参数的对象
       * @param {string} password - 密码
       * @returns {Promise<string>} - 解密后的明文文本
       */
      async function decryptText(params, password) {
        // 解码参数
        const combined = base64ToArrayBuffer(params.combined);

        // 分离IV和密文
        const iv = combined.slice(0, 16);
        const ciphertext = combined.slice(16);
        const salt = params.salt ? base64ToArrayBuffer(params.salt) : iv;

        // 准备密钥派生参数
        const keyMaterial = await crypto.subtle.importKey(
          "raw",
          new TextEncoder().encode(password),
          { name: "PBKDF2" },
          false,
          ["deriveKey"]
        );

        // 派生密钥
        const key = await crypto.subtle.deriveKey(
          {
            name: "PBKDF2",
            salt,
            iterations: params.iterations,
            hash: "SHA-256",
          },
          keyMaterial,
          { name: "AES-CBC", length: 256 },
          true,
          ["decrypt"]
        );

        // 解密
        const decrypted = await crypto.subtle.decrypt(
          { name: "AES-CBC", iv },
          key,
          ciphertext
        );

        return new TextDecoder().decode(decrypted);
      }

      // 辅助函数：ArrayBuffer转Base64
      function arrayBufferToBase64(buffer) {
        return btoa(String.fromCharCode(...new Uint8Array(buffer)));
      }

      // 辅助函数：Base64转ArrayBuffer
      function base64ToArrayBuffer(base64) {
        const binaryString = atob(base64);
        const bytes = new Uint8Array(binaryString.length);
        for (let i = 0; i < binaryString.length; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        return bytes.buffer;
      }

      function toHash(encryptedData) {
        return `#AES.${encryptedData.iterations.toString(36)}.${toBase64URL(
          encryptedData.combined
        )}`;
      }
      /**
       * @param {string} hash - location.hash 的值
       */
      function fromHash(hash) {
        if (!hash.startsWith("#")) {
          return;
        }
        const parts = hash.substring(1).split(".");
        switch (parts[0]) {
          case "AES":
            if (parts.length !== 3) {
              throw new Error(`should be 3 parts, got ${parts.length}`);
            }
            const iterations = Number.parseInt(parts[1], 36);
            if (!Number.isFinite(iterations)) {
              throw new Error("invalid iterations");
            }
            return {
              combined: fromBase64URL(parts[2]),
              iterations,
            };
          default:
            throw new Error("unsupported method", parts[0]);
        }
      }

      // 加密处理
      document
        .getElementById("encrypt")
        .addEventListener("submit", async function () {
          loadingCount += 1;
          render();
          try {
            const text = document.getElementById("text-input").value;
            const password = document.getElementById("password-encrypt").value;

            if (!text) {
              showNotification(
                "错误",
                "请输入要加密的文本",
                "error",
                "encrypt"
              );
              return;
            }

            if (!password) {
              showNotification("错误", "请输入加密密码", "error", "encrypt");
              return;
            }

            try {
              // 调用加密函数
              const encryptedData = await encryptText(text, password);

              document
                .getElementById("decrypted-result-container")
                .classList.add("hidden");

              // 生成网页链接
              // 存在 hash 中，确保数据不会发往服务端
              const webUrl = new URL(location.pathname, location.href);
              webUrl.hash = toHash(encryptedData);

              document.getElementById("web-url").textContent =
                webUrl.toString();
              history.replaceState(undefined, undefined, webUrl);
              render();

              // 显示链接容器
              document
                .getElementById("share-links-container")
                .classList.remove("hidden");

              showNotification(
                "成功",
                "文本已加密并生成分享链接",
                "success",
                "encrypt"
              );
            } catch (error) {
              console.error("Encryption error:", error);
              showNotification(
                "加密失败",
                "发生了一个错误，请重试",
                "error",
                "encrypt"
              );
            }
          } finally {
            loadingCount -= 1;
            render();
          }
        });
      // 解密处理
      document
        .getElementById("decrypt")
        .addEventListener("submit", async function () {
          loadingCount += 1;
          try {
            document
              .getElementById("decrypted-result-container")
              .classList.add("hidden");
            render();
            // 从URL参数获取加密数据
            const encryptedData = fromHash(location.hash);

            const password = document.getElementById("password-decrypt").value;

            // 验证必要参数
            if (!encryptedData.combined) {
              showNotification(
                "错误",
                "请通过链接提供密文",
                "error",
                "decrypt"
              );
              return;
            }

            // 验证IV+密文格式是否正确（至少需要包含完整IV）
            // 24　是最小的base64长度，仅 iv 的 16 字节编码成 base64 就会有24
            if (encryptedData.combined.length < 24) {
              showNotification("错误", "密文格式不正确", "error", "decrypt");
              return;
            }

            if (!Number.isFinite(encryptedData.iterations)) {
              showNotification(
                "错误",
                "加密参数不完整，请使用正确的分享链接",
                "error",
                "decrypt"
              );
              return;
            }

            if (!password) {
              showNotification("错误", "请输入解密密码", "error", "decrypt");
              return;
            }

            try {
              // 调用解密函数
              const decryptedText = await decryptText(encryptedData, password);

              if (!decryptedText) {
                throw new Error("解密失败，可能密码错误");
              }

              // 显示解密结果
              document.getElementById("decrypted-result").textContent =
                decryptedText;
              document
                .getElementById("decrypted-result-container")
                .classList.remove("hidden");

              showNotification("成功", "文本已成功解密", "success", "decrypt");
            } catch (error) {
              console.error("Decryption error:", error);
              showNotification(
                "解密失败",
                "密码可能不正确",
                "error",
                "decrypt"
              );
            }
          } catch (error) {
            console.error("Parsing error:", error);
            showNotification("解密失败", "链接不合法", "error", "decrypt");
          } finally {
            loadingCount -= 1;
            render();
          }
        });

      // 显示通知
      function showNotification(
        title,
        message,
        type = "success",
        area = "encrypt"
      ) {
        const notification = document.getElementById(`${area}-notification`);
        notification.innerHTML = `
          <div class="flex items-center">
            <div class="mr-3">
              ${getIcon(type)}
            </div>
            <div>
              <h3 class="text-sm font-medium">${title}</h3>
              <p class="text-sm">${message}</p>
            </div>
          </div>
        `;

        let class_ = "p-4 rounded-md mb-4";
        // 设置通知背景颜色
        switch (type) {
          case "success":
            class_ += " bg-green-100 text-green-800";
            break;
          case "error":
            class_ += " bg-red-100 text-red-800";
            break;
          case "warning":
            class_ += " bg-yellow-100 text-yellow-800";
            break;
          case "info":
            class_ += " bg-blue-100 text-blue-800";
            break;
        }
        notification.setAttribute("class", class_);
      }

      function getIcon(type) {
        switch (type) {
          case "success":
            return '<i class="fa fa-check-circle text-green-500 text-xl"></i>';
          case "error":
            return '<i class="fa fa-exclamation-circle text-red-500 text-xl"></i>';
          case "warning":
            return '<i class="fa fa-exclamation-triangle text-yellow-500 text-xl"></i>';
          case "info":
            return '<i class="fa fa-info-circle text-blue-500 text-xl"></i>';
          default:
            return "";
        }
      }

      window.addEventListener("hashchange", () => {
        render();
      });
      render();
    </script>
  </body>
</html>
